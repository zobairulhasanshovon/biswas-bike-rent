<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Biswas Bike Rent</title>
  <link rel="icon" href="images/logo-icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header (same on every page) -->
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo"><img src="images/logo-icon.svg" alt="Logo"> Biswas Bike Rent</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="bikes.html">Bikes</a>
        <a href="rent.html">Rent a Bike</a>
        <a href="contact.html">Contact</a>
        <span id="navUser"></span>
      </nav>
    </div>
  </header>

  <form class="form-box small-form" onsubmit="return login()">
    <h2>Login</h2>

    <p class="note">
      <b>Test accounts</b><br>
      Admin: admin@biswasbike.com / admin123<br>
      Customer: customer@biswasbike.com / 123456
    </p>

    <label for="email">Email</label>
    <input type="email" id="email">

    <label for="password">Password</label>
    <input type="password" id="password">

    <input type="submit" value="Login" class="btn">
    <p><br>No account? <a href="register.html">Register here</a></p>
  </form>

  <!-- Footer (same on every page) -->
  <footer class="footer">
    <p>Biswas Bike Rent &bull; Kuratoli, Dhaka &bull; 01700-000000</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
